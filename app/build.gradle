plugins {

    alias(libs.plugins.android.application)

    id("com.chaquo.python")

}









android {

    flavorDimensions "pyVersion"

    productFlavors {

        create("py38") { dimension = "pyVersion" }

    }

    chaquopy {

        defaultConfig {



            buildPython "/usr/local/bin/python3.8"





            sourceSets {

                getByName("main") {

                    srcDir("app/src/main/python")

                }

            }

            version = "3.8"

            pip {
                install "pandas"
                install "numpy"}



        }

        productFlavors {

            getByName("py38") { version = "3.8" }

        }

        sourceSets {}

    }

    namespace = "com.example.aviation"

    compileSdk = 35





    defaultConfig {

        applicationId = "com.example.aviation"

        minSdk = 31

        targetSdk = 35

        versionCode = 1

        versionName = "1.0"



        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"



        ndk {

            abiFilters "arm64-v8a"

        }











    }





    buildTypes {

        release {

            minifyEnabled false

            proguardFiles(

                    getDefaultProguardFile("proguard-android-optimize.txt"),

                    "proguard-rules.pro"

            )

        }

    }

    compileOptions {

        sourceCompatibility = JavaVersion.VERSION_11

        targetCompatibility = JavaVersion.VERSION_11

    }







}

dependencies {



    implementation(libs.appcompat)

    implementation(libs.material)

    implementation(libs.activity)

    implementation(libs.constraintlayout)

    testImplementation(libs.junit)

    androidTestImplementation(libs.ext.junit)

    androidTestImplementation(libs.espresso.core)

    implementation 'com.opencsv:opencsv:5.7.1'



// For JSON processing (usually already included in Android)

    implementation 'org.json:json:20240303'



// RecyclerView (usually already included in modern Android projects)

    implementation 'androidx.recyclerview:recyclerview:1.3.2'



// AppCompat (usually already included)

    implementation 'androidx.appcompat:appcompat:1.6.1'



// Material Design Components (optional but recommended)

    implementation 'com.google.android.material:material:1.10.0'



}